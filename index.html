<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WU Wohnungen</title>
<style>
:root{--bg:#fff;--card:#f4f4f5;--tx:#111;--mu:#666;--ac:#0a7d4f}
@media(prefers-color-scheme:dark){:root{--bg:#111;--card:#1d1d1f;--tx:#eee;--mu:#999;--ac:#3ddc97}}
body{margin:0;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
h1{font-size:20px;margin:16px 0 2px}.mu{color:var(--mu);font-size:13px}
a{display:block;background:var(--card);border-radius:12px;margin:10px 0;overflow:hidden;color:inherit;text-decoration:none}
img{width:100%;height:150px;object-fit:cover;display:block}.b{padding:10px 12px}
.p{font-weight:700;font-size:18px}.n{background:var(--ac);color:#fff;border-radius:6px;padding:1px 6px;font-size:12px;margin-left:6px}
.w{color:#d33;font-size:13px}
</style></head><body>
<h1>🏠 Wohnungen für die WU</h1><div class="mu" id="u">lädt…</div><div class="mu" id="s"></div><div id="l"></div>
<script>
fetch("listings.json?"+Date.now()).then(r=>r.json()).then(d=>{
 u.textContent="Stand: "+new Date(d.updated).toLocaleString("de-AT")+" · "+d.listings.length+" Treffer";
 const t=Date.now();
 s.textContent="Quellen: "+Object.entries(d.sources||{}).map(([k,v])=>k+" "+(typeof v=="number"?v:"✗")).join(" · ");
 d.listings.sort((a,b)=>(new Date(b.first_seen)-new Date(a.first_seen))||(b.score-a.score));
 l.innerHTML=d.listings.map(x=>{const nw=t-new Date(x.first_seen)<864e5;
 return `<a href="${x.url}" target="_blank" rel="noopener">${x.img?`<img src="${x.img}" loading="lazy">`:""}
 <div class="b"><span class="p">€${x.price}</span>${nw?'<span class="n">NEU</span>':""}
 <div>${x.title}</div><div class="mu">${x.plz} ${x.source||""} · ${x.rooms||"?"} Zi · ${x.size||"?"} m²</div>
 ${x.warn?'<div class="w">⚠ auffällig günstig, Betrugsgefahr</div>':""}</div></a>`}).join("")
}).catch(()=>u.textContent="Noch keine Daten. Workflow einmal starten.");
</script></body></html>
